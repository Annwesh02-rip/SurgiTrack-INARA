[project]
name = "ai"
version = "0.1.0"
description = "CNN-based surgical instrument recognition module for SurgiTrack"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "numpy",
    "opencv-python",
    "pillow",
    "torch",
    "torchvision",
]

[project.scripts]
ai = "ai:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"