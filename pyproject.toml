[project]
name = "surgitrack-backend"
version = "0.1.0"
description = "SurgiTrack FastAPI Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "pydantic-settings",
    "python-multipart",
    "pyjwt",
    "pwdlib[argon2]",
    "email-validator"
]

[tool.uv]
package = false

